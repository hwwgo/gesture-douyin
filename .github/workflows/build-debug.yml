name: Build debug APK

# 自动产出可直接安装的 debug APK（无需本地 SDK）：
#   · push / PR  → 构建并上传 artifact，在 Actions 页面下载
#   · 打 v* tag  → 额外把 APK 挂到 GitHub Release
#   · 也可在 Actions 页手动点 "Run workflow"
#
# 注意：这里**不用** android-actions/setup-android。
# 它 v3 会执行 `sdkmanager tools`，而 `tools` 包在新版 cmdline-tools（16+）里已被移除，
# 必然报 "Warning: Failed to find package 'tools'" 并让 job 直接失败。
# runner 镜像本来就预装完整 SDK，直接用即可，缺组件时自己调 sdkmanager 补。

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release 需要

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定版本，避免 runner 预装更高版本 build-tools 时行为漂移
  BT_VERSION: "35.0.0"
  PLATFORM_VERSION: "android-35"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK（复用 runner 预装）
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK：$SDK"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDK 目录：$SDK"
          echo "--- 现有组件 ---"
          ls -d "$SDK"/build-tools/* "$SDK"/platforms/android-* 2>/dev/null || true

          # 缺 build-tools 35 / platform 35 才补装（runner 一般已自带）
          need=""
          ls -d "$SDK"/build-tools/"${BT_VERSION%%.*}"* > /dev/null 2>&1 \
            || need="$need build-tools;${BT_VERSION}"
          [ -d "$SDK/platforms/$PLATFORM_VERSION" ] \
            || need="$need platforms;$PLATFORM_VERSION"
          if [ -n "$need" ]; then
            SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
            echo "补装：$need（sdkmanager: ${SM:-未找到}）"
            if [ -n "$SM" ]; then
              yes | "$SM" $need > /dev/null 2>&1 \
                || echo "::warning::组件安装失败，build.sh 会退回现有版本"
            fi
          else
            echo "build-tools $BT_VERSION 与 platform $PLATFORM_VERSION 已存在"
          fi

      - name: 缓存依赖与模型（约 35MB）
        uses: actions/cache@v4
        with:
          path: |
            deps
            app/assets/gesture/gesture_recognizer.task
            app/assets/face/face_landmarker.task
          key: mediapipe-0.10.14-${{ runner.os }}-v1

      - name: 缓存 debug 签名密钥
        uses: actions/cache@v4
        with:
          # 固定一份 debug 密钥，连续几次构建出来的包可以互相覆盖升级
          path: keys/debug.keystore
          key: debug-keystore-v1

      - name: 下载 MediaPipe 依赖与模型
        run: bash scripts/fetch-deps.sh

      - name: 构建 debug APK
        run: bash build.sh debug

      - name: 校验产物（debuggable + 签名）
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          APK="$(ls build/debug/*.apk | head -1)"
          echo "APK=$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|application-debuggable" || true
          "$BT/apksigner" verify --print-certs "$APK" | head -3

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gesture-douyin-debug-${{ github.sha }}
          path: build/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 附加到 Release（仅在推送 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/debug/*.apk
          generate_release_notes: true
          body: |
            自动构建的 **debug** 版本：已开启 `android:debuggable`，
            用 debug 密钥签名，安装前请先卸载正式版。
